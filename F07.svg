<svg xmlns="http://www.w3.org/2000/svg" width="360" height="690" viewBox="0 0 360 690"><rect x="1" y="1" width="358" height="688" rx="10" fill="white" stroke="#333"/><rect x="12" y="12" width="336" height="28" fill="#eee"/><text x="23" y="31" font-family="Arial" font-size="12">ResisXV | DEMO ONLY | Worker</text><text x="20" y="65" font-family="Arial" font-size="18" font-weight="bold">Cancel with clear consequences</text><rect x="18" y="88" width="324" height="79" fill="#f4f4f4" stroke="#aaa"/><text x="27" y="108" font-family="Arial" font-size="13" font-weight="bold">Request R-01</text><text x="27" y="127" font-family="Arial" font-size="12">State: pending / confirmed DEMO</text><text x="27" y="143" font-family="Arial" font-size="12">Cancellation terms: [accepted terms]</text><text x="27" y="159" font-family="Arial" font-size="12">Fee if applicable: [calculate from terms]</text><rect x="18" y="181" width="324" height="95" fill="#f4f4f4" stroke="#aaa"/><text x="27" y="201" font-family="Arial" font-size="13" font-weight="bold">Before cancellation</text><text x="27" y="220" font-family="Arial" font-size="12">Unspent eligible holds are released.</text><text x="27" y="236" font-family="Arial" font-size="12">Spent funds are not automatically refunded.</text><text x="27" y="252" font-family="Arial" font-size="12">Do not show a cancellation as free unless</text><text x="27" y="268" font-family="Arial" font-size="12">verified.</text><a href="#F09"><rect x="18" y="290" width="324" height="30" fill="#d5d5d5" stroke="#555"/><text x="28" y="310" font-family="Arial" font-size="12">Confirm cancellation example</text></a><a href="#F05"><rect x="18" y="329" width="324" height="30" fill="white" stroke="#555"/><text x="28" y="349" font-family="Arial" font-size="12">Keep the stay</text></a><a href="#F05"><rect x="18" y="368" width="324" height="30" fill="white" stroke="#555"/><text x="28" y="388" font-family="Arial" font-size="12">Back to status</text></a></svg>