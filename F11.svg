<svg xmlns="http://www.w3.org/2000/svg" width="360" height="690" viewBox="0 0 360 690"><rect x="1" y="1" width="358" height="688" rx="10" fill="white" stroke="#333"/><rect x="12" y="12" width="336" height="28" fill="#eee"/><text x="23" y="31" font-family="Arial" font-size="12">ResisXV | DEMO ONLY | Employer approver</text><text x="20" y="65" font-family="Arial" font-size="18" font-weight="bold">Decide one funding request</text><rect x="18" y="88" width="324" height="95" fill="#f4f4f4" stroke="#aaa"/><text x="27" y="108" font-family="Arial" font-size="13" font-weight="bold">Request and provider checks</text><text x="27" y="127" font-family="Arial" font-size="12">R-01 / selected night / eligible DEMO</text><text x="27" y="143" font-family="Arial" font-size="12">Provider quote: MXN 300</text><text x="27" y="159" font-family="Arial" font-size="12">Confirmation source / time: [operations]</text><text x="27" y="175" font-family="Arial" font-size="12">Do not approve stale or unconfirmed supply.</text><rect x="18" y="197" width="324" height="95" fill="#f4f4f4" stroke="#aaa"/><text x="27" y="217" font-family="Arial" font-size="13" font-weight="bold">Before commitment</text><text x="27" y="236" font-family="Arial" font-size="12">Program cap: MXN 3,000</text><text x="27" y="252" font-family="Arial" font-size="12">Other commitments: MXN 0</text><text x="27" y="268" font-family="Arial" font-size="12">If approved: allocate MXN 300</text><text x="27" y="284" font-family="Arial" font-size="12">Available after approval: MXN 2,700</text><rect x="18" y="306" width="324" height="79" fill="#f4f4f4" stroke="#aaa"/><text x="27" y="326" font-family="Arial" font-size="13" font-weight="bold">Decision record</text><text x="27" y="345" font-family="Arial" font-size="12">Decision reason: [required]</text><text x="27" y="361" font-family="Arial" font-size="12">Personal copay: MXN 0 ≤ accepted cap 0</text><text x="27" y="377" font-family="Arial" font-size="12">Final checks can still block confirmation.</text><a href="#F12"><rect x="18" y="399" width="324" height="30" fill="#d5d5d5" stroke="#555"/><text x="28" y="419" font-family="Arial" font-size="12">Approve after final checks example</text></a><a href="#F09"><rect x="18" y="438" width="324" height="30" fill="white" stroke="#555"/><text x="28" y="458" font-family="Arial" font-size="12">Deny with a reason example</text></a><a href="#F10"><rect x="18" y="477" width="324" height="30" fill="white" stroke="#555"/><text x="28" y="497" font-family="Arial" font-size="12">Back to program</text></a></svg>